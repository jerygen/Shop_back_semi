spring.application.name=Shop

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/shop_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${TEST_DB_USERNAME:shop_test_user}
spring.datasource.password=${TEST_DB_PASSWORD:shop_test_password}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false

spring.jwt.secret=test-secret-key-test-secret-key-test-secret-key
