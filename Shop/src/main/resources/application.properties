spring.application.name=Shop

server.port=${SERVER_PORT:9000}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin1234}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database=mysql

# JWT Secret key
spring.jwt.secret=${JWT_SECRET:SahL5G83mGzrulJzffw-eD7RqphsXluJPBwxu0ncBFo}

springdoc.swagger-ui.path=/swagger

# Optional admin bootstrap account. If user id or password is empty, no account is created.
admin.user-id=${ADMIN_USER_ID:}
admin.password=${ADMIN_PASSWORD:}
admin.user-name=${ADMIN_USER_NAME:Administrator}
