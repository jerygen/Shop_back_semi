spring.application.name=Shop

server.port=9000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD:shop_password}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.database=mysql

