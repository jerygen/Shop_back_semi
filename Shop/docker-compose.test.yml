services:
  mysql-test:
    image: mysql:8.4
    container_name: shop-mysql-test
    restart: unless-stopped
    ports:
      - "${TEST_MYSQL_BIND_HOST:-127.0.0.1}:3307:3306"
    environment:
      MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:-shop_test}
      MYSQL_USER: ${TEST_MYSQL_USER:-shop_test_user}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:-shop_test_password}
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:-change_me_test_root_password}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
