services:
  app:
    image: ${APP_IMAGE:-shop-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-9000}:9000"
    environment:
      SERVER_PORT: 9000
      DB_URL: "${DB_URL:?DB_URL is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      JPA_DDL_AUTO: "${JPA_DDL_AUTO:-update}"
      JPA_SHOW_SQL: "${JPA_SHOW_SQL:-false}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: shop-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-shop}"
      MYSQL_USER: "${MYSQL_USER:-admin}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
