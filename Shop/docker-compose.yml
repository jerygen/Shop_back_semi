services:
  app:
    image: ${APP_IMAGE:-shop-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-9000}:9000"
    environment:
      SERVER_PORT: 9000
      DB_URL: "${DB_URL:-jdbc:mysql://mysql:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}"
      DB_USERNAME: "${DB_USERNAME:-admin}"
      DB_PASSWORD: "${DB_PASSWORD:-admin1234}"
      JPA_DDL_AUTO: "${JPA_DDL_AUTO:-update}"
      JPA_SHOW_SQL: "${JPA_SHOW_SQL:-false}"
      JWT_SECRET: "${JWT_SECRET:-SahL5G83mGzrulJzffw-eD7RqphsXluJPBwxu0ncBFo}"
      ADMIN_USER_ID: "${ADMIN_USER_ID:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_USER_NAME: "${ADMIN_USER_NAME:-Administrator}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: shop-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-shop}"
      MYSQL_USER: "${MYSQL_USER:-admin}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-admin1234}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-admin1234}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
